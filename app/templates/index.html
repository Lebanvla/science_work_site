<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Road Segmentation App</title>
    <style>
        :root {
            color-scheme: light dark;
            font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }
        body {
            max-width: 960px;
            margin: 0 auto;
            padding: 40px 20px;
            line-height: 1.5;
        }
        .card {
            border: 1px solid #ddd;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
        }
        .row {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
        }
        button {
            border: 0;
            border-radius: 10px;
            padding: 10px 16px;
            cursor: pointer;
            font-weight: 700;
        }
        #status {
            margin-top: 18px;
            font-weight: 700;
        }
        #hash {
            word-break: break-all;
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            opacity: 0.85;
        }
        #result {
            display: none;
            margin-top: 24px;
            max-width: 100%;
            border-radius: 14px;
            border: 1px solid #ddd;
        }
        .hint {
            opacity: 0.75;
        }
    </style>
</head>
<body>
    <h1>Сегментация дорожной поверхности</h1>
    <p class="hint">
        Загрузите изображение дороги. Результат появится ниже после обработки.
    </p>

    <div class="card">
        <form id="upload-form" enctype="multipart/form-data">
            <div class="row">
                <input id="file-input" name="file" type="file" accept=".jpg,.jpeg,.png,.webp,image/jpeg,image/png,image/webp" required />
                <button type="submit">Построить маску</button>
            </div>
        </form>
        <div id="status"></div>
        <div id="hash"></div>
        <img id="result" alt="Изображение с наложенной маской дороги" />
    </div>

    <script>
        const form = document.getElementById("upload-form");
        const fileInput = document.getElementById("file-input");
        const statusEl = document.getElementById("status");
        const hashEl = document.getElementById("hash");
        const resultImg = document.getElementById("result");
        let pollTimer = null;

        function setStatus(text) {
            statusEl.textContent = text;
        }

        function stopPolling() {
            if (pollTimer) {
                clearInterval(pollTimer);
                pollTimer = null;
            }
        }

        async function pollResult(pictureHash) {
            const response = await fetch(`/get/${pictureHash}`);
            const data = await response.json();

            if (!response.ok) {
                throw new Error(data.detail || "Ошибка получения результата");
            }

            if (data.status === "processing") {
                setStatus("Маска строится...");
                return;
            }

            if (data.status === "error") {
                stopPolling();
                setStatus(`Ошибка обработки: ${data.message || "неизвестная ошибка"}`);
                return;
            }

            if (data.status === "ready") {
                stopPolling();
                setStatus("Готово");
                resultImg.src = `${data.url}?t=${Date.now()}`;
                resultImg.style.display = "block";
            }
        }

        form.addEventListener("submit", async (event) => {
            event.preventDefault();
            stopPolling();
            resultImg.style.display = "none";
            resultImg.removeAttribute("src");
            hashEl.textContent = "";

            if (!fileInput.files.length) {
                setStatus("Выберите файл изображения");
                return;
            }

            const formData = new FormData();
            formData.append("file", fileInput.files[0]);
            setStatus("Отправка изображения...");

            try {
                const response = await fetch("/predict", {
                    method: "POST",
                    body: formData,
                });
                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.detail || "Ошибка загрузки изображения");
                }

                const pictureHash = data.picture_hash;
                hashEl.textContent = `picture_hash: ${pictureHash}`;
                setStatus("Задача поставлена в очередь. Маска строится...");

                await pollResult(pictureHash);
                pollTimer = setInterval(() => {
                    pollResult(pictureHash).catch((error) => {
                        stopPolling();
                        setStatus(`Ошибка: ${error.message}`);
                    });
                }, 2000);
            } catch (error) {
                setStatus(`Ошибка: ${error.message}`);
            }
        });
    </script>
</body>
</html>
